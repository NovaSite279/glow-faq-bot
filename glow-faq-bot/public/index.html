<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4c">
<meta name="robots" content="noindex">
<title>Glow Hair Studio | Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23d9a441'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' font-family='Georgia' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="avatar" aria-hidden="true">G</div>
    <div class="who">
      <h1>Glow Hair Studio</h1>
      <p id="status">Sandton. Automated assistant</p>
    </div>
    <button class="newchat" id="reset" type="button">New chat</button>
  </header>

  <main class="chat" id="chat" aria-live="polite" aria-label="Conversation">
    <p class="day">Today</p>
    <div class="msg bot"><p>Hi! 👋 Welcome to Glow Hair Studio. Ask me about prices, opening hours, bookings or anything else about the salon.</p><span class="time" data-now></span></div>
  </main>

  <div class="try" id="try">
    <p>Try asking:</p>
    <div class="chips">
      <button type="button">What time do you open on Saturday?</button>
      <button type="button">How much for a cut for my son, he's 8?</button>
      <button type="button">How much for highlights and a cut?</button>
      <button type="button">Do you do nails?</button>
      <button type="button">Can I book Saturday at 10?</button>
    </div>
  </div>

  <form class="compose" id="compose" autocomplete="off">
    <label for="msg" class="sr">Message</label>
    <textarea id="msg" rows="1" maxlength="600" placeholder="Message" enterkeyhint="send"></textarea>
    <button type="submit" id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z" fill="currentColor"/></svg>
    </button>
  </form>
</div>
</body>
</html>
